<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تأكيد الحجز - أبو زهرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #050301;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: rtl;
        }
        .confirm-card {
            max-width: 550px;
            width: 100%;
            background: #0e0b06;
            border-radius: 32px;
            padding: 28px;
            border: 1px solid #F5C542;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .confirm-card h2 {
            color: #F5C542;
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .customer-info {
            background: #1a1508;
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
        }
        .customer-info p {
            margin: 8px 0;
            font-size: 15px;
        }
        .customer-info span {
            color: #F5C542;
            font-weight: bold;
        }
        .bank-number {
            background: #1a1508;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .bank-number .number {
            font-size: 28px;
            font-weight: bold;
            color: #F5C542;
            letter-spacing: 2px;
        }
        .input-group {
            background: #1a1508;
            padding: 12px;
            border-radius: 16px;
            margin: 20px 0;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #a07d3a;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            background: #050301;
            border: 1px solid rgba(229,184,60,0.3);
            border-radius: 16px;
            color: white;
            text-align: center;
            font-size: 18px;
            font-family: 'Cairo', sans-serif;
        }
        .input-group input:focus {
            outline: none;
            border-color: #F5C542;
        }
        .upload-area {
            border: 2px dashed rgba(229,184,60,0.3);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #F5C542;
            background: rgba(229,184,60,0.05);
        }
        .upload-area i {
            font-size: 48px;
            color: #F5C542;
            margin-bottom: 12px;
        }
        .preview-img {
            max-width: 100%;
            border-radius: 16px;
            margin-top: 15px;
            display: none;
        }
        .upload-btn {
            background: #F5C542;
            color: #050301;
            border: none;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .upload-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(229,184,60,0.3);
        }
        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 20px;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
        }
        .message.success {
            background: rgba(16,185,129,0.2);
            color: #10b981;
        }
        .message.error {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
        }
        .message.loading {
            background: rgba(229,184,60,0.2);
            color: #F5C542;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(229,184,60,0.3);
            border-top-color: #F5C542;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #a07d3a;
        }
        .already-confirmed {
            text-align: center;
            padding: 20px;
            background: rgba(16,185,129,0.1);
            border-radius: 20px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="confirm-card" id="confirmCard">
    <h2>✅ تأكيد حجزك</h2>
    <div id="customerInfo" class="customer-info">
        <div class="loading-spinner"></div> جاري تحميل بياناتك...
    </div>
    
    <div id="bankSection" style="display: none;">
        <div class="bank-number">
            <div class="number">150 جنيه</div>
            <div style="margin: 10px 0;">على رقم فودافون كاش</div>
            <div class="number">01559319483</div>
            <div style="margin-top: 8px;">📌 باسم: <strong>صلاح</strong></div>
        </div>
        
        <div class="input-group">
            <label>📱 رقم التليفون المحول منه</label>
            <input type="tel" id="senderPhone" placeholder="أدخل رقم التليفون اللي حولت منه">
        </div>
        
        <div class="upload-area" id="uploadArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>اضغط لرفع صورة الإسكرين</p>
            <p style="font-size: 12px;">(صورة التحويل من فودافون كاش)</p>
            <input type="file" id="screenshotInput" accept="image/*" style="display: none;">
        </div>
        
        <img id="previewImg" class="preview-img">
        
        <button class="upload-btn" id="submitBtn">
            📤 إرسال التأكيد
        </button>
    </div>
    
    <div id="alreadyConfirmed" style="display: none;" class="already-confirmed">
        ✅ <strong>تم تأكيد حجزك مسبقاً</strong><br>
        شكراً لتأكيد حجزك، سيتم التواصل معك قريباً.
    </div>
    
    <div id="messageDiv" class="message"></div>
    <div class="footer">أبو زهرة للإلكترونيات 🎧</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    // Firebase Config
    firebase.initializeApp({
        apiKey: "AIzaSyDrhyNCKO5tzF-tiRQevk12kLM8hAkkr0w",
        authDomain: "reservations-e411a.firebaseapp.com",
        projectId: "reservations-e411a"
    });

    const db = firebase.firestore();
    const IMGBB_API_KEY = "d96cbbe822e1ace2ef3247edf29d6de2";
    
    // جلب الـ ID من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const reservationId = urlParams.get('id');
    
    if (!reservationId) {
        document.getElementById('customerInfo').innerHTML = `
            <p style="color: #ef4444; text-align: center;">❌ رابط غير صالح</p>
            <p style="text-align: center; margin-top: 10px;">عذراً، لم نتمكن من العثور على حجزك.</p>
        `;
    } else {
        // جلب بيانات العميل من Firebase
        db.collection('reservations').doc(reservationId).get().then(doc => {
            if (doc.exists) {
                const data = doc.data();
                
                // عرض بيانات العميل
                document.getElementById('customerInfo').innerHTML = `
                    <p>👤 <span>الاسم:</span> ${data.name || '—'}</p>
                    <p>📱 <span>رقم التليفون:</span> ${data.phone || '—'}</p>
                    <p>🎧 <span>نوع السماعة:</span> ${data.device || '—'}</p>
                    <p>📍 <span>العنوان:</span> ${data.address || '—'}</p>
                    <p>📅 <span>تاريخ الحجز:</span> ${formatDate(data.created_at)}</p>
                `;
                
                // التحقق إذا كان العميل رفع إسكرين قبل كده
                if (data.payment_proof_url) {
                    document.getElementById('bankSection').style.display = 'none';
                    document.getElementById('alreadyConfirmed').style.display = 'block';
                    document.getElementById('messageDiv').innerHTML = '';
                } else {
                    document.getElementById('bankSection').style.display = 'block';
                }
            } else {
                document.getElementById('customerInfo').innerHTML = `
                    <p style="color: #ef4444; text-align: center;">❌ حجز غير موجود</p>
                    <p style="text-align: center; margin-top: 10px;">عذراً، لم نتمكن من العثور على حجزك.</p>
                `;
            }
        }).catch(err => {
            console.error(err);
            document.getElementById('customerInfo').innerHTML = `
                <p style="color: #ef4444; text-align: center;">❌ حدث خطأ</p>
                <p style="text-align: center; margin-top: 10px;">يرجى المحاولة مرة أخرى لاحقاً.</p>
            `;
        });
    }
    
    function formatDate(ts) {
        if (!ts) return '—';
        let d = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts));
        return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    
    // رفع الصورة على imgBB
    async function uploadToImgBB(file) {
        const formData = new FormData();
        formData.append('image', file);
        formData.append('key', IMGBB_API_KEY);
        
        const response = await fetch('https://api.imgbb.com/1/upload', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        if (result.success) {
            return result.data.url;
        } else {
            throw new Error(result.error?.message || 'فشل رفع الصورة');
        }
    }
    
    // ربط الأحداث
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('screenshotInput');
    const previewImg = document.getElementById('previewImg');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('messageDiv');
    const senderPhoneInput = document.getElementById('senderPhone');
    
    if (uploadArea) {
        uploadArea.addEventListener('click', () => fileInput.click());
    }
    
    if (fileInput) {
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                    previewImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
    }
    
    if (submitBtn) {
        submitBtn.onclick = async function() {
            const file = fileInput.files[0];
            const senderPhone = senderPhoneInput.value.trim();
            
            if (!file) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ يرجى رفع صورة الإسكرين';
                return;
            }
            if (!senderPhone) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ يرجى كتابة رقم التليفون المحول منه';
                return;
            }
            
            messageDiv.className = 'message loading';
            messageDiv.innerHTML = '<span class="loading-spinner"></span> جاري رفع الإسكرين...';
            submitBtn.disabled = true;
            
            try {
                const imageUrl = await uploadToImgBB(file);
                
                await db.collection('reservations').doc(reservationId).update({
                    payment_proof_url: imageUrl,
                    sender_phone: senderPhone,
                    payment_submitted_at: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                messageDiv.className = 'message success';
                messageDiv.innerHTML = '✅ تم إرسال التأكيد بنجاح!<br>سيتم مراجعة التحويل قريباً وسنصلك رسالة تأكيد.';
                
                // إخفاء نموذج الرفع وإظهار رسالة التأكيد
                document.getElementById('bankSection').style.display = 'none';
                document.getElementById('alreadyConfirmed').style.display = 'block';
                document.getElementById('alreadyConfirmed').innerHTML = `
                    ✅ <strong>تم إرسال تأكيد حجزك بنجاح!</strong><br>
                    سيتم مراجعة التحويل خلال 24 ساعة وسنقوم بإشعارك.
                `;
                
            } catch(err) {
                console.error(err);
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ حدث خطأ: ' + (err.message || 'حاول مرة أخرى');
                submitBtn.disabled = false;
            }
        };
    }
</script>
</body>
</html>
